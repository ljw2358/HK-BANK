<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="metaTitle">HK BANK | 글로벌 슈퍼 뱅킹 플랫폼</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-secondary: #ffffff;
            --card-border: #e2e8f0;
            --accent-blue: #0066ff;
            --accent-blue-glow: rgba(0, 102, 255, 0.2);
            --accent-green: #00c853;
            --text-main: #1a202c;
            --text-muted: #718096;
            --pi-color: #f7931a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        select option {
            background-color: #ffffff !important;
            color: #1a202c !important;
        }

        body {
            background-color: #d1d8e0;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-secondary);
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hk-logo {
            background: var(--accent-blue);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
        }

        .bank-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #1a202c;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #4a5568;
            cursor: pointer;
        }

        .lang-bar {
            padding: 10px 20px;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .lang-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .lang-select {
            background: #fff;
            color: #1a202c;
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
            max-width: 210px;
        }

        main {
            padding: 20px;
            flex: 1;
        }

        .greeting-box {
            margin-bottom: 22px;
        }

        .greeting-title {
            font-size: 22px;
            font-weight: 900;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .greeting-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        .account-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .account-name {
            font-size: 14px;
            font-weight: 700;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .account-badge {
            background: rgba(0, 102, 255, 0.1);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .account-balance {
            font-family: 'Roboto Mono', monospace;
            font-size: 26px;
            font-weight: 900;
            color: #1a202c;
            margin-bottom: 18px;
        }

        .account-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-action {
            background: #f7fafc;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #2d3748;
            cursor: pointer;
            text-align: center;
        }

        .btn-action.primary {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .pi-trust-card {
            background: linear-gradient(135deg, #1a202c, #2d3748);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 24px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .pi-trust-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .pi-trust-title {
            font-size: 13px;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pi-rate-badge {
            background: rgba(0, 200, 83, 0.2);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .pi-trust-balance {
            font-family: 'Roboto Mono', monospace;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 18px;
        }

        .pi-trust-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-pi-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            text-align: center;
        }

        .btn-pi-action.primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .quick-menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
            background: #fff;
            padding: 18px 12px;
            border-radius: 18px;
            border: 1px solid var(--card-border);
        }

        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .quick-icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #f0f4ff;
            color: var(--accent-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .quick-label {
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
        }

        .history-section {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }

        .history-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 3px;
        }

        .history-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-amount {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 800;
        }

        .history-amount.plus { color: var(--accent-green); }
        .history-amount.minus { color: #e53e3e; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 24px 36px 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .modal.active .modal-body {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 900;
            color: #1a202c;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #a0aec0;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-input {
            width: 100%;
            background: #f7fafc;
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: #1a202c;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
        }

        .modal-btn {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-blue-glow);
        }

        .loading-spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

        <main>
            <div class="greeting-box">
                <h1 class="greeting-title" data-i18n="greetingTitle">글로벌 슈퍼 뱅킹 플랫폼 👋</h1>
                <p class="greeting-sub" data-i18n="greetingSub">오늘도 안전하고 스마트한 금융 생활을 지원합니다.</p>

                    <button class="btn-pi-action" data-i18n="btnManage" onclick="openBankModal('manage')">관리하기</button>

        </div>

            quickLoan: "마이너스대출",
            quickQR: "QR결제",
            historyTitle: "최근의 거래내역",
            hist1_name: "HK-ROBOT 개발지원금",
            hist2_name: "스타벅스 (블랙커피)",
            
            modal_transfer: "계좌간 간편 송금",
            modal_fill: "계좌 잔액 채우기",
            modal_loan: "마이너스대출 한도 조회",
            modal_qr: "QR 결제 승인",
            modal_ph: "금액 입력 (원 또는 PI)",
            modal_btn: "확인 완료",
            success_msg: "✅ 정상 처리되었습니다."
        };

        const translationCache = { ko: koSource };

        async function fetchAutoTranslation(targetLang) {
            if (translationCache[targetLang]) return translationCache[targetLang];
            const spinner = document.getElementById('langSpinner');
            if (spinner) spinner.style.display = 'inline-block';

            const translatedObj = {};
            const keys = Object.keys(koSource);
            try {
                const promises = keys.map(async (key) => {
                    const text = koSource[key];
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    translatedObj[key] = data[0][0][0];
                });
                await Promise.all(promises);
                translationCache[targetLang] = translatedObj;
            } catch (err) {
                return koSource;
            } finally {
                if (spinner) spinner.style.display = 'none';
            }
            return translatedObj;
        }

        async function translateText(text, targetLang) {
            if (targetLang === 'ko') return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0][0][0];
            } catch(e) {
                return text;
            }
        }

        async function openBankModal(type) {
            const modal = document.getElementById('bankModal');
            const titleEl = document.getElementById('modalTitle');
            const contentEl = document.getElementById('modalContent');
            const curDict = translationCache[currentLang] || koSource;

            let titleKey = 'modal_transfer';
            if(type === 'fill') titleKey = 'modal_fill';
            else if(type === 'loan') titleKey = 'modal_loan';
            else if(type === 'qr') titleKey = 'modal_qr';
            else if(type === 'manage' || type === 'swap') titleKey = 'piTrustTitle';

            titleEl.innerText = await translateText(curDict[titleKey] || "금액 입력", currentLang);
            let phText = await translateText(curDict.modal_ph || "금액 입력", currentLang);
            let btnText = await translateText(curDict.modal_btn || "확인", currentLang);

            contentEl.innerHTML = `
                <div class="form-group">
                    <input class="form-input" id="bankInputAmount" placeholder="${phText}" autofocus>
                </div>
                <button class="modal-btn" onclick="executeBankAction()">${btnText}</button>
            `;
            modal.classList.add('active');
        }

        function executeBankAction() {
            const curDict = translationCache[currentLang] || koSource;
            alert(curDict.success_msg || "✅ 정상 처리되었습니다.");
            closeModal();
        }

        function closeModal() {
            document.getElementById('bankModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target.id === 'bankModal') closeModal();
        }

        async function changeLanguage(lang) {
            currentLang = lang;
            let t = await fetchAutoTranslation(lang);

            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });
            document.dir = ['ar', 'fa', 'ur', 'he'].includes(lang) ? 'rtl' : 'ltr';
        }
    </script>
</body>
</html>
