<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK WORLD BANK | 글로벌 슈퍼 뱅킹 플랫폼</title>
    <style>
        :root {
            --bg-body: #121214;
            --bg-app: #1a1a1e;
            --toss-blue: #0064ff;
            --text-main: #f1f1f3;
            --text-muted: #9b95a1;
            --card-bg: #25252b;
            --border-color: #35353d;
            --success: #00c853;
            --pi-color: #9f7938;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-app);
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-app);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-align: center;
            width: 100%;
        }

        .lang-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            max-width: 130px;
            cursor: pointer;
        }

        /* Main Content */
        .content {
            padding: 0 20px 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-title {
            text-align: center;
            margin-top: 10px;
        }

        .hero-title h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .hero-title p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Account Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .card-balance {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--toss-blue);
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #35353d;
            color: var(--text-main);
        }

        .btn-pi {
            background-color: var(--pi-color);
            color: #ffffff;
        }

        /* 10대 연동망 그리드 (Quick Menu) */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            background-color: #31313a;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: background-color 0.2s;
        }

        .menu-item:hover .menu-icon {
            background-color: var(--toss-blue);
        }

        .menu-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        /* Transaction History */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: -5px;
            text-align: center;
        }

        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tx-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tx-info h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .tx-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tx-amount {
            font-size: 15px;
            font-weight: 600;
            color: var(--success);
        }

        /* Footer AGI Support Info */
        .footer-support {
            text-align: center;
            padding: 20px 0;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
