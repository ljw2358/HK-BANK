<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="metaTitle">HK BANK | 글로벌 슈퍼 뱅킹 플랫폼</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Orbitron:wght@500;700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-secondary: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --accent-blue: #0066ff;
            --accent-blue-glow: rgba(0, 102, 255, 0.25);
            --accent-green: #00c853;
            --text-main: #1a202c;
            --text-muted: #718096;
            --pi-color: #f7931a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        select option {
            background-color: #ffffff !important;
            color: #1a202c !important;
        }

        body {
            background-color: #d1d8e0;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-secondary);
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hk-logo {
            background: var(--accent-blue);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .bank-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #1a202c;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #4a5568;
            cursor: pointer;
        }

        .lang-bar {
            padding: 10px 20px;
            background: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
        }

        .lang-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .lang-select {
            background: #fff;
            color: #1a202c;
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
            max-width: 190px;
        }

        main {
            padding: 20px;
            flex: 1;
        }

        .greeting-box {
            margin-bottom: 22px;
        }

        .greeting-title {
            font-size: 22px;
            font-weight: 900;
            color: #1a202c;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .greeting-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 주거래 통장 카드 */
        .account-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .account-name {
            font-size: 14px;
            font-weight: 700;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .account-badge {
            background: rgba(0, 102, 255, 0.1);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .account-balance {
            font-family: 'Roboto Mono', monospace;
            font-size: 26px;
            font-weight: 900;
            color: #1a202c;
            margin-bottom: 18px;
        }

        .account-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-action {
            background: #f7fafc;
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #2d3748;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-action.primary {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px var(--accent-blue-glow);
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* Pi 신탁 & 세이프박스 카드 */
        .pi-trust-card {
            background: linear-gradient(135deg, #1a202c, #2d3748);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 24px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .pi-trust-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .pi-trust-title {
            font-size: 13px;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pi-rate-badge {
            background: rgba(0, 200, 83, 0.2);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(0, 200, 83, 0.4);
        }

        .pi-trust-balance {
            font-family: 'Roboto Mono', monospace;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 18px;
        }

        .pi-trust-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-pi-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            text-align: center;
        }

        .btn-pi-action.primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* 빠른 메뉴 4종 아이콘바 */
        .quick-menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
            background: #fff;
            padding: 18px 12px;
            border-radius: 18px;
            border: 1px solid var(--card-border);
        }

        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .quick-icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #f0f4ff;
            color: var(--accent-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .quick-item:active .quick-icon-circle {
            transform: scale(0.9);
        }

        .quick-label {
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
        }

        /* 최근 거래 내역 */
        .history-section {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
        }

        .history-more {
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info h4 {
            font-size: 13px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 3px;
        }

        .history-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .history-amount {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 800;
        }

        .history-amount.plus { color: var(--accent-green); }
        .history-amount.minus { color: #e53e3e; }

        /* 모달 팝업 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            color: #1a202c;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #a0aec0;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .form-input {
            width: 100%;
            background: #f7fafc;
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #1a202c;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
        }

        .modal-btn {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 15px var(--accent-blue-glow);
        }

        .loading-spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 -->
        <header>
            <div class="logo-box">
                <span class="hk-logo">HK</span>
                <span class="bank-text">BANK</span>
            </div>
            <div class="header-right">
                <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                <button class="icon-btn" onclick="openNavDrawer()"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- 60개국 언어 선택 바 -->
        <div class="lang-bar">
            <div class="lang-info">
                <i class="fa-solid fa-globe"></i>
                <span data-i18n="langEngineLabel">60개국 글로벌 뱅킹 엔진</span>
                <div class="loading-spinner" id="langSpinner"></div>
            </div>
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ko" selected>🇰🇷 한국어 (Korean)</option>
                <option value="en">🇺🇸 영어 (English)</option>
                <option value="zh-CN">🇨🇳 중국어 간체 (Chinese Simplified)</option>
                <option value="zh-TW">🇹🇼 중국어 번체 (Chinese Traditional)</option>
                <option value="ja">🇯🇵 일본어 (Japanese)</option>
                <option value="es">🇪🇸 스페인어 (Spanish)</option>
                <option value="hi">🇮🇳 힌디어 (Hindi)</option>
                <option value="ar">🇸🇦 아랍어 (Arabic)</option>
                <option value="pt">🇧🇷 포르투갈어 (Portuguese)</option>
                <option value="ru">🇷🇺 러시아어 (Russian)</option>
                <option value="de">🇩🇪 독일어 (German)</option>
                <option value="fr">🇫🇷 프랑스어 (French)</option>
                <option value="id">🇮🇩 인도네시아어 (Indonesian)</option>
                <option value="it">🇮🇹 이탈리아어 (Italian)</option>
                <option value="tr">🇹🇷 튀르키예어 (Turkish)</option>
                <option value="vi">🇻🇳 베트남어 (Vietnamese)</option>
                <option value="th">🇹🇭 태국어 (Thai)</option>
            </select>
        </div>

        <main>
            <!-- 인사말 영역 -->
            <div class="greeting-box">
                <h1 class="greeting-title" data-i18n="greetingTitle">글로벌 슈퍼 뱅킹 플랫폼 👋</h1>
                <p class="greeting-sub" data-i18n="greetingSub">오늘도 안전하고 스마트한 금융 생활을 지원합니다.</p>
            </div>

            <!-- HK 주거래통장 카드 -->
            <div class="account-card">
                <div class="account-header">
                    <span class="account-name"><i class="fa-solid fa-wallet" style="color:var(--accent-blue);"></i> <span data-i18n="accountName">HK 주거래통장</span></span>
                    <span class="account-badge" data-i18n="accountBadge">출금가능</span>
                </div>
                <div class="account-balance" id="krwBalanceDisplay">314,159,000 원</div>
                <div class="account-btns">
                    <button class="btn-action" data-i18n="btnTransfer" onclick="openBankModal('transfer')">송금하기</button>
                    <button class="btn-action primary" data-i18n="btnFill" onclick="openBankModal('fill')">채우기</button>
                </div>
            </div>

            <!-- Pi 신탁 & 세이프박스 카드 -->
            <div class="pi-trust-card">
                <div class="pi-trust-header">
                    <span class="pi-trust-title"><span style="color:var(--pi-color); font-weight:900;">π</span> <span data-i18n="piTrustTitle">Pi 신탁 & 세이프박스</span></span>
                    <span class="pi-rate-badge" data-i18n="piRateBadge">연 31.41% 복리</span>
                </div>
                <div class="pi-trust-balance">314,159.00 PI</div>
                <div class="pi-trust-btns">
                    <button class="btn-pi-action" data-i18n="btnManage" onclick="openBankModal('manage')">관리하기</button>
                    <button class="btn-pi-action primary" data-i18n="btnSwap" onclick="openBankModal('swap')">즉시 환전</button>
                </div>
            </div>

            <!-- 빠른 메뉴 4종 그리드 -->
            <div class="quick-menu-grid">
                <div class="quick-item" onclick="openBankModal('transfer')">
                    <div class="quick-icon-circle"><i class="fa-solid fa-paper-plane"></i></div>
                    <span class="quick-label" data-i18n="quickTransfer">이체</span>
                </div>
                <div class="quick-item" onclick="openBankModal('fill')">
                    <div class="quick-icon-circle"><i class="fa-solid fa-won-sign"></i></div>
                    <span class="quick-label" data-i18n="quickFill">채우기</span>
                </div>
                <div class="quick-item" onclick="openBankModal('loan')">
                    <div class="quick-icon-circle"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                    <span class="quick-label" data-i18n="quickLoan">마이너스대출</span>
                </div>
                <div class="quick-item" onclick="openBankModal('qr')">
                    <div class="quick-icon-circle"><i class="fa-solid fa-qrcode"></i></div>
                    <span class="quick-label" data-i18n="quickQR">QR결제</span>

            <!-- 최근 거래 내역 -->
            <div class="history-section">
                <div class="history-header">
                    <h3 class="history-title" data-i18n="historyTitle">최근의 거래내역</h3>

                </div>

                <div class="history-item">
                    <div class="history-info">
                        <h4 data-i18n="hist1_name">HK-ROBOT 개발지원금</h4>
                        <p>오늘 오전 10:24</p>
                    </div>
                    <div class="history-amount plus">+ 50,000,000원</div>
                </div>

                <div class="history-item">
                    <div class="history-info">
                        <h4 data-i18n="hist2_name">스타벅스 (블랙커피)</h4>
                        <p>어제 오후 14:10</p>

                    <div class="history-amount minus">- 4,500원</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 뱅킹 작업 모달 팝업 -->
    <div class="modal" id="bankModal" onclick="closeModalOutside(event)">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">간편 금융 작업</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- 스크립트 엔진 -->
    <script>
        let currentLang = 'ko';

        const koSource = {
            langEngineLabel: "60개국 글로벌 뱅킹 엔진",
            greetingTitle: "글로벌 슈퍼 뱅킹 플랫폼 👋",
            greetingSub: "오늘도 안전하고 스마트한 금융 생활을 지원합니다.",
            accountName: "HK 주거래통장",
            accountBadge: "출금가능",
            btnTransfer: "송금하기",
            btnFill: "채우기",
            piTrustTitle: "Pi 신탁 & 세이프박스",
            piRateBadge: "연 31.41% 복리",
            btnManage: "관리하기",
            btnSwap: "즉시 환전",
            quickTransfer: "이체",
            quickFill: "채우기",
            quickLoan: "마이너스대출",
            quickQR: "QR결제",
            historyTitle: "최근의 거래내역",
            historyMore: "전체보기",
            hist1_name: "HK-ROBOT 개발지원금",
            hist2_name: "스타벅스 (블랙커피)",
            
            // 모달 다국어
            modal_transfer_title: "계좌간 간편 송금",
            modal_fill_title: "계좌 잔액 채우기",
            modal_loan_title: "마이너스대출 한도 조회",
            modal_qr_title: "QR 결제 스캐너 구동",
            modal_amount_label: "거래 금액 입력",
            modal_ph_amount: "금액 입력 (원 또는 PI)",
            modal_submit_transfer: "송금하기",
            modal_submit_fill: "가져오기",
            modal_submit_loan: "한도 승인 신청",
            modal_submit_qr: "QR 코드 스캔 승인",
            modal_success: "✅ HK BANK 금융 작업이 정상 처리되었습니다."
        };

        const translationCache = { ko: koSource };

        async function fetchAutoTranslation(targetLang) {
            if (translationCache[targetLang]) return translationCache[targetLang];
            const spinner = document.getElementById('langSpinner');
            if (spinner) spinner.style.display = 'inline-block';

            const translatedObj = {};
            const keys = Object.keys(koSource);
            try {
                const promises = keys.map(async (key) => {
                    const text = koSource[key];
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    translatedObj[key] = data[0][0][0];
                });
                await Promise.all(promises);
                translationCache[targetLang] = translatedObj;
            } catch (err) {
                return koSource;
            } finally {
                if (spinner) spinner.style.display = 'none';
            }
            return translatedObj;
        }

        async function translateText(text, targetLang) {
            if (targetLang === 'ko') return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                return data[0][0][0];
            } catch(e) {
                return text;
            }
        }

        async function openBankModal(type) {
            const modal = document.getElementById('bankModal');
            const titleEl = document.getElementById('modalTitle');
            const contentEl = document.getElementById('modalContent');
            const curDict = translationCache[currentLang] || koSource;

            let titleKey = 'modal_transfer_title';
            let btnKey = 'modal_submit_transfer';

            if(type === 'fill') { titleKey = 'modal_fill_title'; btnKey = 'modal_submit_fill'; }
            else if(type === 'loan') { titleKey = 'modal_loan_title'; btnKey = 'modal_submit_loan'; }
            else if(type === 'qr') { titleKey = 'modal_qr_title'; btnKey = 'modal_submit_qr'; }
            else if(type === 'manage' || type === 'swap') { titleKey = 'piTrustTitle'; btnKey = 'btnSwap'; }

            titleEl.innerText = await translateText(curDict[titleKey] || "금융 작업", currentLang);
            let labelText = await translateText(curDict.modal_amount_label || "거래 금액 입력", currentLang);
            let phText = await translateText(curDict.modal_ph_amount || "금액 입력", currentLang);
            let btnText = await translateText(curDict[btnKey] || "확인", currentLang);

            contentEl.innerHTML = `
                <div class="form-group">
                    <label class="form-label">${labelText}</label>
                    <input class="form-input" id="bankInputAmount" placeholder="${phText}">
                </div>
                <button class="modal-btn" onclick="executeBankAction('${type}')">${btnText}</button>
            `;
            modal.classList.add('active');
        }

        function executeBankAction(type) {
            const curDict = translationCache[currentLang] || koSource;
            alert(curDict.modal_success || "✅ HK BANK 금융 작업이 정상 처리되었습니다.");
            closeModal();
        }

        function closeModal() {
            document.getElementById('bankModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target.id === 'bankModal') closeModal();
        }

        function openNavDrawer() {
            alert("HK BANK 네비게이터 메뉴가 호출되었습니다.");
        }

        async function changeLanguage(lang) {
            currentLang = lang;
            let t = await fetchAutoTranslation(lang);

            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });
            document.dir = ['ar', 'fa', 'ur', 'he'].includes(lang) ? 'rtl' : 'ltr';
        }
    </script>
</body>
</html>
